<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnCharter</title>
<meta name="description" content="OnCharter: the app for superyacht guests and crew.">
<link rel="icon" href="/assets/logo.png">
<style>
:root{--navy:#0B1F3A;--gold:#C9A54C;--goldDark:#9C7C2E;--ivory:#F7F3EA;--line:#E3DCCB;--ink:#2B3440;--muted:#7A7466}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--goldDark)}
header{background:var(--navy);padding:18px 20px}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px;border-radius:9px}
header a.brand{font-family:Georgia,serif;font-size:21px;color:#F5F1E6;text-decoration:none;letter-spacing:.3px}
header a.brand span{color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:Georgia,serif;color:var(--navy);font-size:32px;margin:0 0 4px;font-weight:normal}
.updated{color:var(--muted);font-size:14px;margin:0 0 26px}
h2{font-family:Georgia,serif;color:var(--navy);font-size:21px;font-weight:normal;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
strong{color:var(--navy)}
ul{padding-left:22px}
li{margin:5px 0}
.tablewrap{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14.5px}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#F5F1E6;font-weight:600}
footer{border-top:1px solid var(--line);padding:20px;text-align:center;color:var(--muted);font-size:14px}
footer a{margin:0 8px}
.hero{text-align:center;padding:60px 20px 40px}
.hero img{width:110px;height:110px;border-radius:24px;box-shadow:0 8px 24px rgba(11,31,58,.25)}
.hero h1{font-size:42px;margin-top:22px}
.hero p{font-size:18px;color:var(--muted);max-width:520px;margin:10px auto}
.pill{display:inline-block;margin-top:18px;padding:9px 18px;border-radius:999px;background:var(--navy);color:var(--gold);font-weight:600;font-size:15px}
</style>
</head>
<body>
<header><div class="in"><a href="/"><img src="/assets/logo.png" alt="OnCharter"></a><a class="brand" href="/">On<span>·</span>Charter</a></div></header>
<main class="hero"><img src="/assets/logo.png" alt="OnCharter app icon"><h1>OnCharter</h1>
<p>The app for superyacht guests and crew: chat with the crew, share charter photos, and read the yacht's guest compendium.</p>
<span class="pill">Coming soon to iPhone and Android</span></main>
<footer>© 2026 OnCharter · <a href="/terms">Terms of Use</a> <a href="/privacy">Privacy Policy</a> <a href="mailto:support@oncharter.app">Contact</a></footer>
</body>
</html>
